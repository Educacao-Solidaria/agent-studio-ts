name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build-storybook

  # Playwright num job à parte: o navegador (e as libs do sistema) só aqui; o `web` segue leve.
  e2e:
    # O ubuntu-latest virou 26.04 (out/2026) e o Playwright 1.60.0 (o Chromium 1223 do cache local)
    # não instala nele ("does not support chromium on ubuntu26.04-x64"). Subir o Playwright é à parte.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # O mesmo Studio na imagem de produção (cache do Buildx do job `image`), sob os cabeçalhos do
      # nginx: e2e/image reprova violação de CSP no console (o playwright.image.config sobe o container).
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          provenance: false
          tags: educacao-solidaria/agent-studio:dev
          cache-from: type=gha
      - run: pnpm test:e2e:image
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  # Regressão visual (e2e/visual): os PNG de referência nascem e são comparados SÓ nesta imagem, a
  # oficial do Playwright na versão exata do @playwright/test (o playwright.visual.config recusa
  # outra; o src/visual.test confere a tag). PNG novo ou mudado reprova o job, que gera os
  # candidatos na mesma imagem e os sobe no artefato visual-snapshots: revise e commite os PNG.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # v1.60.0-noble, pelo digest do índice multi-arch (o runner puxa a linux/amd64)
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:visual
      # A 2ª volta escreve fora do test-results: lá fica o diff da 1ª (esperado, atual, diferença).
      - name: PNG candidatos na mesma imagem (só para revisar e commitar)
        if: failure()
        run: pnpm test:visual --update-snapshots=changed --output=/tmp/visual-candidatos
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: |
            apps/web/e2e/visual/__snapshots__
            apps/web/test-results
          retention-days: 7

  # Imagem de produção (Dockerfile na raiz) com o cache do Buildx no GitHub, e o smoke no container:
  # sobe sem backend, sem root, na 3000 (contratos da Fase 5, §2 e §5). Nada vai para registry.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Contexto do build (.dockerignore)
        run: apps/web/docker/smoke.sh context
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          provenance: false
          tags: educacao-solidaria/agent-studio:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke no container
        run: apps/web/docker/smoke.sh image educacao-solidaria/agent-studio:dev

  # O ecossistema do compose do flow-gateway-go (contratos da Fase 5, §1–§5) com ESTE estúdio: os 4
  # repositórios lado a lado (dos outros 3, a main), cada imagem na tag do contrato, sem push, o
  # `up --wait` e o e2e/stack, que confere pela origem do estúdio cada link do proxy (sem navegador).
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Sem o artefato .dockerbuild de cada build e sem o evento do PR despejado no log.
      DOCKER_BUILD_RECORD_UPLOAD: false
      BUILDX_METADATA_PROVENANCE: disabled
    defaults:
      run:
        working-directory: flow-gateway-go/deploy/compose
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent-studio-ts
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Educacao-Solidaria/flow-gateway-go
          path: flow-gateway-go
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Educacao-Solidaria/semantic-cache-rs
          path: semantic-cache-rs
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Educacao-Solidaria/brain-router-py
          path: brain-router-py
          persist-credentials: false
      - name: .env de mentira (nada chama a OpenRouter)
        run: sed 's/=$/=valor-falso-do-ci/' .env.example > .env
      - uses: docker/setup-buildx-action@v4
      # O cache do Buildx só é gravado na main: o PR lê o dela (os vizinhos mudam pouco) e não
      # soma ~1 GB por branch no cache do repositório.
      - name: Imagem do gateway
        uses: docker/build-push-action@v7
        with:
          context: flow-gateway-go
          tags: educacao-solidaria/flow-gateway:dev
          load: true
          provenance: false
          cache-from: type=gha,scope=stack-gateway
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=stack-gateway' || '' }}
      - name: Imagem do cache
        uses: docker/build-push-action@v7
        with:
          context: semantic-cache-rs
          tags: educacao-solidaria/semantic-cache:dev
          load: true
          provenance: false
          cache-from: type=gha,scope=stack-cache
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=stack-cache' || '' }}
      - name: Imagem do RAG
        uses: docker/build-push-action@v7
        with:
          context: brain-router-py
          tags: educacao-solidaria/brain-router:dev
          load: true
          provenance: false
          cache-from: type=gha,scope=stack-rag
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=stack-rag' || '' }}
      - name: Imagem do estúdio (este commit)
        uses: docker/build-push-action@v7
        with:
          context: agent-studio-ts
          tags: educacao-solidaria/agent-studio:dev
          load: true
          provenance: false
          cache-from: type=gha,scope=stack-studio
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=stack-studio' || '' }}
      - name: Sobe o ecossistema
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agent-studio-ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: agent-studio-ts/apps/web
      - run: pnpm test:e2e:stack
        working-directory: agent-studio-ts/apps/web
      - name: Estado e logs dos containers
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color
