name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build-storybook

  # Playwright num job à parte: o navegador (e as libs do sistema) só aqui; o `web` segue leve.
  e2e:
    # O ubuntu-latest virou 26.04 (out/2026) e o Playwright 1.60.0 (o Chromium 1223 do cache local)
    # não instala nele ("does not support chromium on ubuntu26.04-x64"). Subir o Playwright é à parte.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  # Imagem de produção (Dockerfile na raiz) com o cache do Buildx no GitHub, e o smoke no container:
  # sobe sem backend, sem root, na 3000 (contratos da Fase 5, §2 e §5). Nada vai para registry.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Contexto do build (.dockerignore)
        run: apps/web/docker/smoke.sh context
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          provenance: false
          tags: educacao-solidaria/agent-studio:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke no container
        run: apps/web/docker/smoke.sh image educacao-solidaria/agent-studio:dev
