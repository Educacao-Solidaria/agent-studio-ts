# Estúdio em produção (contratos da Fase 5, §2 e §5): o SPA do apps/web e o proxy de mesma
# origem para o backend, na porta 3000. Na imagem, vira /etc/nginx/conf.d/default.conf.
server {
    listen 3000;
    root /srv/studio;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Backend pelo DNS do Docker, resolvido a cada pedido (proxy_pass com variável): a imagem
    # sobe sem backend e serviço ausente vira 502, que o painel mostra como fora do ar. O `valid`
    # curto acompanha o container que volta com outro IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $gateway http://gateway:8080;
    set $rag http://rag:8000;
    set $cache http://cache:8099;
    proxy_connect_timeout 5s;
    proxy_http_version 1.1;

    # SPA: rota do cliente cai no index.html, sempre revalidado (é ele que aponta os assets novos).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # O Vite põe hash no nome de tudo o que gera em assets/: cache de um ano. Arquivo que falta é
    # 404, nunca o index.html — HTML guardado por um ano no lugar de um pedaço quebraria o import().
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API v1 do RAG. O corpo vai até o teto do brain-router (2 MiB, o mesmo do upload do estúdio);
    # sem buffer, o SSE de /api/v1/search/stream não depende do X-Accel-Buffering do servidor.
    location /api/ {
        proxy_pass $rag;
        client_max_body_size 2m;
        proxy_buffering off;
    }

    # API do gateway, com o SSE evento a evento. O stream do gateway não tem heartbeat: o prazo de
    # leitura cobre a espera pelo 1º token (o padrão de 60 s cortaria um modelo lento).
    location /v1/ {
        proxy_pass $gateway;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /health/gateway {
        proxy_pass $gateway/healthz;
    }

    location = /health/rag {
        proxy_pass $rag/healthz;
    }

    # Do cache só a saúde passa: a API de depuração dele expõe o conteúdo (/cache/entries, /stats).
    location /health/cache {
        proxy_pass $cache;
    }
}
