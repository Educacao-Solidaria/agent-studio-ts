# Estúdio em produção (contratos da Fase 5, §2 e §5): o SPA do apps/web e o proxy de mesma
# origem para o backend, na porta 3000. Na imagem, vira /etc/nginx/conf.d/default.conf.
server {
    listen 3000;
    root /srv/studio;
    server_tokens off;

    # Cabeçalhos de segurança em toda resposta: o `always` cobre também 404, 413 e 502, e o `merge`
    # (nginx >= 1.29.3) soma estes aos `add_header` de cada location. Sem ele, o Cache-Control de /
    # e de /assets/ descartaria todos os do server.
    add_header_inherit merge;
    # CSP medida no Chromium contra o build (e2e/image/csp.spec.ts): tudo só da própria origem.
    # - style-src 'unsafe-inline': o Dialog do Radix (react-remove-scroll) injeta um <style> ao abrir
    #   a paleta e os Modelos. Não abre brecha: CSS injetado não tem para onde mandar dado (img, font
    #   e connect fechados), e as classes do Tailwind já estilizam qualquer HTML.
    # - img-src 'self': o /favicon.ico que o navegador pede sozinho.
    # - connect-src: a origem (API, SSE, saúde, WebSocket) e, de fora, só a lista de preços da
    #   OpenRouter (chat/model-pricing.ts), pelo caminho exato.
    # - Sem X-Frame-Options: o frame-ancestors vale em todo navegador que roda o app. Sem
    #   upgrade-insecure-requests: o compose serve em HTTP puro.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self' https://openrouter.ai/api/v1/models; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    # O navegador só aceita HSTS por HTTPS (RFC 6797, §8.1): na 3000 em HTTP puro não faz nada, e
    # vale atrás do proxy TLS de produção. Sem includeSubDomains/preload: é decisão do dono do domínio.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Backend pelo DNS do Docker, resolvido a cada pedido (proxy_pass com variável): a imagem
    # sobe sem backend e serviço ausente vira 502, que o painel mostra como fora do ar. O `valid`
    # curto acompanha o container que volta com outro IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $gateway http://gateway:8080;
    set $rag http://rag:8000;
    set $cache http://cache:8099;
    proxy_connect_timeout 5s;
    proxy_http_version 1.1;

    # SPA: rota do cliente cai no index.html, sempre revalidado (é ele que aponta os assets novos).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # O Vite põe hash no nome de tudo o que gera em assets/: cache de um ano. Arquivo que falta é
    # 404, nunca o index.html — HTML guardado por um ano no lugar de um pedaço quebraria o import().
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API v1 do RAG. O corpo vai até o teto do brain-router (2 MiB, o mesmo do upload do estúdio);
    # sem buffer, o SSE de /api/v1/search/stream não depende do X-Accel-Buffering do servidor.
    location /api/ {
        proxy_pass $rag;
        client_max_body_size 2m;
        proxy_pass_request_headers off;
        proxy_buffering off;
    }

    # API do gateway, com o SSE evento a evento. O stream do gateway não tem heartbeat: o prazo de
    # leitura cobre a espera pelo 1º token (o padrão de 60 s cortaria um modelo lento).
    location /v1/ {
        proxy_pass $gateway;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 404 = /index.html;
        proxy_read_timeout 300s;
    }

    location = /health/gateway {
        proxy_pass $gateway/healthz;
    }

    location = /health/rag {
        proxy_pass $rag/healthz;
    }

    # Do cache só a saúde passa: a API de depuração dele expõe o conteúdo (/cache/entries, /stats).
    location = /health/cache {
        proxy_pass $cache/health;
        proxy_hide_header Content-Type;
    }
}
